name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  # Every PR runs this job, whatever it changes: it is a required check on main, and a
  # required check that never starts would block the merge.
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: backend
    runs-on: ubuntu-latest
    # A real PostgreSQL for the tests that need one (overlapping requests, row locks); the rest
    # build their own SQLite databases.
    services:
      postgres:
        image: postgres:16  # as in docker-compose.yml
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Coverage with a floor (pyproject.toml); sys.monitoring keeps the overhead small.
      - run: pytest -q --cov --cov-report=term
        env:
          COVERAGE_CORE: sysmon
          FA_TEST_POSTGRES_URL: postgresql+psycopg://ci:ci-only@localhost:5432/postgres

# Local development services. `docker compose up -d db` starts Postgres on localhost:5433
# (5433 so it does not clash with a Postgres already installed on 5432).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fitbit_agent
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: fitbit_agent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitbit_agent -d fitbit_agent"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Monitoring the deployed API from this machine (docs/monitoring.md):
  # `docker compose --profile monitoring up -d`, then Grafana on http://localhost:3001.
  prometheus:
    image: prom/prometheus:v2.51.2
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:10.4.2
    profiles: ["monitoring"]
    depends_on: [prometheus]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"  # local only: bound to 127.0.0.1 below
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/patterns.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  db-data:
  prometheus-data:
  grafana-data:

# Local development services. `docker compose up -d db` starts Postgres on localhost:5433
# (5433 so it does not clash with a Postgres already installed on 5432).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fitbit_agent
      POSTGRES_PASSWORD: local-dev-only
      POSTGRES_DB: fitbit_agent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitbit_agent -d fitbit_agent"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Monitoring the deployed API from this machine (docs/monitoring.md): put METRICS_TOKEN and
  # GF_SECURITY_ADMIN_PASSWORD in monitoring/monitoring.env (git-ignored), then
  # `docker compose --profile monitoring up -d --build`; Grafana on http://localhost:3001 (sign in).
  # History is kept in the volumes across restarts and rebuilds (Prometheus: 90 days).
  prometheus:
    build:
      context: .
      dockerfile: monitoring/prometheus/Dockerfile
    profiles: ["monitoring"]
    env_file: monitoring/monitoring.env
    restart: unless-stopped
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    build:
      context: .
      dockerfile: monitoring/grafana/Dockerfile
    profiles: ["monitoring"]
    depends_on: [prometheus]
    env_file: monitoring/monitoring.env
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"

volumes:
  db-data:
  prometheus-data:
  grafana-data:

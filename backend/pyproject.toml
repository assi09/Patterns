[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitbit-agent"
version = "0.1.0"
description = "Agentic analysis of longitudinal Fitbit data"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "cryptography>=44",
    "fastapi>=0.115",
    "google-auth-oauthlib>=1.5",
    "httpx2>=2.14",
    "numpy>=1.26",
    "openai>=3.35",
    "pandas>=2.2",
    "psycopg[binary]>=3.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scipy>=1.13",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.knowledge" = ["*.md", "index/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

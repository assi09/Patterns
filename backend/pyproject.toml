[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fitbit-agent"
version = "0.1.0"
description = "Agentic analysis of longitudinal Fitbit data"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20",
    "cryptography>=44",
    "fastapi>=0.115",
    "google-auth-oauthlib>=1.5",
    "httpx2>=2.14",
    "numpy>=1.26",
    "openai>=3.35",
    "pandas>=2.2",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "scipy>=1.13",
    "sentry-sdk[fastapi]>=2.40,<3",  # 3.0 dropped include_local_variables, a privacy setting
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.knowledge" = ["*.md", "index/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# CI runs `pytest --cov` and fails below the floor (94% when it was set, 2026-11-22). Raise it as
# coverage rises; lowering it needs a reason in the PR.
[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 92
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

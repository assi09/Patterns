# Prometheus on a laptop, scraping the deployed API's /metrics (docs/monitoring.md).
# The bearer token is read from monitoring/metrics-token, which git ignores; it must equal the
# API's FA_METRICS_TOKEN on Railway.
global:
  scrape_interval: 30s
  scrape_timeout: 20s

scrape_configs:
  - job_name: patterns-api
    scheme: https
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api-production-eccff.up.railway.app"]
        labels:
          environment: production
